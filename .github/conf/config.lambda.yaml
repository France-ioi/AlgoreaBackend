# config to be used for now with lambda deployment, with all config entries (to be overridden by env vars) and
# with domains (not definable with env varaibles)
server:
  rootpath: "/"
  port: 8080
  compress: false
  domainOverride: ""
auth:
  loginModuleURL: ""
  clientID: ""
  clientSecret: ""
token:
  platformName: ""
  publicKeyFile: ""
  privateKeyFile: ""
database:
  user: ""
  passwd: ""
  addr: ""
  dbname: ""
  net: tcp
  allownativepasswords: true
  # Re-applied after every pool checkout (COM_RESET_CONNECTION). Do not put these in DSN params.
  # Values are written raw into SET: numbers unquoted; string vars include quotes in the value.
  sessionParams:
    innodb_lock_wait_timeout: "5"
logging:
  format: "" # text, json
  output: stdout # stdout, stderr, file
  level: debug # debug, info, warning, error, fatal, panic
  logSQLQueries: true
  logRawSQLQueries: false
propagation:
  # Override with ALGOREA_PROPAGATION__ENDPOINT / ALGOREA_PROPAGATION__DISABLEFORRESULTS /
  # ALGOREA_PROPAGATION__LOGCHUNKCOUNTERS. Empty endpoint = sync propagation.
  # logChunkCounters needs performance_schema=ON for deltas; uses non-logging queries
  # and degrades quietly when PS is off.
  endpoint: ""
  disableForResults: false
  logChunkCounters: true
domains:
  -
    domains: [default]
    allUsersGroup: ALLUSERS # 1 for dev db, 3 for prod
    nonTempUsersGroup: NONTMPUSERS
    tempUsersGroup: TMPUSERS # 4 for dev, 2 for prod
